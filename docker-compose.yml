services:
  # Spatial Database: PostgreSQL 16 with PostGIS 3.4
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: cityflow-postgis
    environment:
      POSTGRES_DB: cityflow_db
      POSTGRES_USER: cityflow
      POSTGRES_PASSWORD: cityflow_dev_secret
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityflow -d cityflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Streaming: Apache Kafka 3.8.0 in KRaft Mode (No ZooKeeper required)
  kafka:
    image: apache/kafka:3.8.0
    container_name: cityflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Kafka Topic Provisioning
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: cityflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "bash", "-c" ]
    command: |
      "
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic bengaluru.traffic.events.v1
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic bengaluru.transit.delays.v1
      echo 'CityFlow Kafka topics initialized successfully.'
      "
    restart: "no"

  # Backend: FastAPI Routing & Mobility Intelligence
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cityflow-backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://cityflow:cityflow_dev_secret@postgis:5432/cityflow_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Frontend: Next.js + MapLibre Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cityflow-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgis_data:
    driver: local
